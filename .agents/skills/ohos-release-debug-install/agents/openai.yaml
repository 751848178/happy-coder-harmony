interface:
  display_name: "OHOS Real Device Install"
  short_description: "Default real-device install to release package using current signing materials"
  default_prompt: "Install the latest app build to a HarmonyOS/OpenHarmony real device. Unless the user explicitly asks for a debug package or live debugging, default to building and installing a release package that uses the profile and certificate currently configured in ohos/build-profile.json5, then report the device, signing material, artifact path, and installation result."
