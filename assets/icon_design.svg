<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- 定义渐变和阴影 -->
  <defs>
    <!-- 华为鸿蒙风格的渐变 -->
    <linearGradient id="harmonyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F7931E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF0000;stop-opacity:1" />
    </linearGradient>
    
    <!-- HC字母的渐变 -->
    <linearGradient id="hcGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#F0F0F0;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#E0E0E0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D0D0D0;stop-opacity:1" />
    </linearGradient>
    
    <!-- 阴影效果 -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.2"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 内阴影效果 -->
    <filter id="innerShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="-2" result="offsetblur"/>
      <feFlood flood-color="#FFFFFF" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="512" height="512" fill="#FAFAFA"/>
  
  <!-- 倾斜的鸿蒙圆环 (15度倾斜) -->
  <g transform="rotate(15, 256, 256)">
    <!-- 外圆环 -->
    <circle cx="256" cy="256" r="180" 
            fill="none" 
            stroke="url(#harmonyGradient)" 
            stroke-width="12"
            filter="url(#shadow)"/>
    
    <!-- 内圆环装饰 -->
    <circle cx="256" cy="256" r="165" 
            fill="none" 
            stroke="url(#harmonyGradient)" 
            stroke-width="2"
            opacity="0.6"/>
    
    <!-- 圆环光泽效果 -->
    <ellipse cx="256" cy="156" rx="170" ry="40" 
             fill="url(#harmonyGradient)" 
             opacity="0.15"/>
  </g>
  
  <!-- HC 字母组 -->
  <g transform="rotate(15, 256, 256)" filter="url(#shadow)">
    <!-- H 字母 -->
    <g>
      <!-- H 左竖 -->
      <rect x="180" y="180" width="25" height="152" 
            fill="url(#hcGradient)" 
            rx="4" 
            filter="url(#innerShadow)"/>
      
      <!-- H 右竖 -->
      <rect x="307" y="180" width="25" height="152" 
            fill="url(#hcGradient)" 
            rx="4" 
            filter="url(#innerShadow)"/>
      
      <!-- H 横梁 -->
      <rect x="180" y="243" width="152" height="25" 
            fill="url(#hcGradient)" 
            rx="4" 
            filter="url(#innerShadow)"/>
    </g>
    
    <!-- C 字母 -->
    <g>
      <!-- C 主体 -->
      <path d="M 380 200 
               A 60 60 0 1 1 380 312
               L 355 312
               A 35 35 0 1 0 355 200
               Z" 
            fill="url(#hcGradient)" 
            filter="url(#innerShadow)"/>
    </g>
  </g>
  
  <!-- 高光效果 -->
  <g transform="rotate(15, 256, 256)">
    <ellipse cx="256" cy="140" rx="120" ry="30" 
             fill="white" 
             opacity="0.2"/>
  </g>
</svg>
