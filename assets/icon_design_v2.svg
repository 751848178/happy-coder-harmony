<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- 定义渐变和效果 -->
  <defs>
    <!-- 华为鸿蒙渐变 -->
    <linearGradient id="harmonyGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F7931E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF0000;stop-opacity:1" />
    </linearGradient>
    
    <!-- HC字母渐变 -->
    <linearGradient id="hcGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#F8F8F8;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#E8E8E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D8D8D8;stop-opacity:1" />
    </linearGradient>
    
    <!-- 阴影效果 -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.3"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- HC字母的立体阴影 -->
    <filter id="hcShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.4"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 内阴影效果 -->
    <filter id="innerShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="-1" result="offsetblur"/>
      <feFlood flood-color="#FFFFFF" flood-opacity="0.5"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="512" height="512" fill="#FAFAFA"/>
  
  <!-- 几乎躺平的椭圆形鸿蒙圆圈 (85度倾斜) -->
  <g transform="rotate(85, 256, 256)">
    <!-- 椭圆外环 -->
    <ellipse cx="256" cy="256" rx="200" ry="80" 
             fill="none" 
             stroke="url(#harmonyGradient)" 
             stroke-width="12"
             filter="url(#shadow)"/>
    
    <!-- 椭圆内环装饰 -->
    <ellipse cx="256" cy="256" rx="185" ry="65" 
             fill="none" 
             stroke="url(#harmonyGradient)" 
             stroke-width="2"
             opacity="0.6"/>
    
    <!-- 椭圆光泽效果 -->
    <ellipse cx="256" cy="196" rx="190" ry="35" 
             fill="url(#harmonyGradient)" 
             opacity="0.15"/>
  </g>
  
  <!-- HC 字母浮出效果 (在椭圆后半部分) -->
  <g transform="rotate(85, 256, 256)" filter="url(#hcShadow)">
    <!-- H 字母 -->
    <g transform="translate(280, 230)">
      <!-- H 左竖 -->
      <rect x="0" y="0" width="20" height="60" 
            fill="url(#hcGradient)" 
            rx="3" 
            filter="url(#innerShadow)"/>
      
      <!-- H 右竖 -->
      <rect x="40" y="0" width="20" height="60" 
            fill="url(#hcGradient)" 
            rx="3" 
            filter="url(#innerShadow)"/>
      
      <!-- H 横梁 -->
      <rect x="0" y="20" width="60" height="20" 
            fill="url(#hcGradient)" 
            rx="3" 
            filter="url(#innerShadow)"/>
    </g>
    
    <!-- C 字母 -->
    <g transform="translate(360, 230)">
      <path d="M 40 10 
               A 30 30 0 1 1 40 50
               L 25 50
               A 15 15 0 1 0 25 10
               Z" 
            fill="url(#hcGradient)" 
            filter="url(#innerShadow)"/>
    </g>
  </g>
  
  <!-- HC 字母高光效果 -->
  <g transform="rotate(85, 256, 256)">
    <ellipse cx="330" cy="220" rx="50" ry="15" 
             fill="white" 
             opacity="0.3"/>
  </g>
</svg>
