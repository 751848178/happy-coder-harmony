<svg width="1024" height="512" viewBox="0 0 1024 512" xmlns="http://www.w3.org/2000/svg">
  <!-- 定义毛毡质感渐变和滤镜 -->
  <defs>
    <!-- 华为鸿蒙毛毡渐变 -->
    <radialGradient id="harmonyFeltGradient3" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#FF8A5B;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#E85D2C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CC4A1F;stop-opacity:1" />
    </radialGradient>
    
    <!-- HC字母毛毡渐变 -->
    <radialGradient id="hcFeltGradient3" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#FFB380;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#FF8A5B;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#E85D2C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CC4A1F;stop-opacity:1" />
    </radialGradient>
    
    <!-- 毛毡纹理滤镜 -->
    <filter id="feltTexture3" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="turbulence"/>
      <feColorMatrix in="turbulence" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="discrete" tableValues="0 0.02 0.04 0.06 0.08 0.1 0.12 0.14 0.16 0.18 0.2"/>
      </feComponentTransfer>
      <feGaussianBlur stdDeviation="0.5"/>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    
    <!-- 毛毡边缘柔和效果 -->
    <filter id="feltEdge3">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.15"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- HC字母毛毡阴影 -->
    <filter id="hcFeltShadow3">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dx="1" dy="1" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.2"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 内部光泽 -->
    <radialGradient id="innerGlow3" cx="50%" cy="30%" r="40%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.2" />
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#FFFFFF;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="1024" height="512" fill="#F8F8F8"/>
  
  <!-- 变体1: 标准毛毡质感 -->
  <g transform="translate(128, 128)">
    <text x="128" y="-20" font-family="Arial, sans-serif" font-size="14" fill="#333" text-anchor="middle">标准毛毡质感</text>
    
    <g transform="rotate(85, 128, 128)">
      <ellipse cx="128" cy="128" rx="100" ry="40" 
               fill="url(#harmonyFeltGradient3)" 
               filter="url(#feltEdge3)"/>
      
      <ellipse cx="128" cy="128" rx="98" ry="38" 
               fill="url(#harmonyFeltGradient3)" 
               filter="url(#feltTexture3)"
               opacity="0.8"/>
      
      <ellipse cx="128" cy="118" rx="90" ry="30" 
               fill="url(#innerGlow3)"/>
      
      <ellipse cx="128" cy="128" rx="80" ry="30" 
               fill="none" 
               stroke="#CC4A1F" 
               stroke-width="1"
               opacity="0.3"/>
      
      <!-- HC 字母毛毡浮出 -->
      <g transform="translate(140, 115)" filter="url(#hcFeltShadow3)">
        <rect x="0" y="0" width="10" height="30" fill="url(#hcFeltGradient3)" rx="2" filter="url(#feltTexture3)"/>
        <rect x="20" y="0" width="10" height="30" fill="url(#hcFeltGradient3)" rx="2" filter="url(#feltTexture3)"/>
        <rect x="0" y="10" width="30" height="10" fill="url(#hcFeltGradient3)" rx="2" filter="url(#feltTexture3)"/>
        
        <path d="M 40 5 A 15 15 0 1 1 40 25 L 32 25 A 7 7 0 1 0 32 5 Z" 
              fill="url(#hcFeltGradient3)" filter="url(#feltTexture3)"/>
        
        <!-- HC 内部光泽 -->
        <rect x="1" y="1" width="8" height="28" fill="url(#innerGlow3)" rx="1" opacity="0.6"/>
        <rect x="21" y="1" width="8" height="28" fill="url(#innerGlow3)" rx="1" opacity="0.6"/>
        <rect x="1" y="11" width="28" height="8" fill="url(#innerGlow3)" rx="1" opacity="0.6"/>
        
        <path d="M 38 6 A 14 14 0 1 1 38 24 L 33 24 A 6 6 0 1 0 33 6 Z" 
              fill="url(#innerGlow3)" opacity="0.6"/>
      </g>
      
      <ellipse cx="165" cy="110" rx="40" ry="12" fill="white" opacity="0.1"/>
    </g>
  </g>
  
  <!-- 变体2: 深色毛毡 -->
  <g transform="translate(384, 128)">
    <text x="128" y="-20" font-family="Arial, sans-serif" font-size="14" fill="#333" text-anchor="middle">深色毛毡质感</text>
    
    <g transform="rotate(85, 128, 128)">
      <ellipse cx="128" cy="128" rx="100" ry="40" 
               fill="#CC4A1F" 
               filter="url(#feltEdge3)"/>
      
      <ellipse cx="128" cy="128" rx="98" ry="38" 
               fill="#E85D2C" 
               filter="url(#feltTexture3)"
               opacity="0.8"/>
      
      <ellipse cx="128" cy="118" rx="90" ry="30" 
               fill="url(#innerGlow3)"/>
      
      <ellipse cx="128" cy="128" rx="80" ry="30" 
               fill="none" 
               stroke="#993818" 
               stroke-width="1"
               opacity="0.3"/>
      
      <!-- HC 字母深色毛毡 -->
      <g transform="translate(140, 115)" filter="url(#hcFeltShadow3)">
        <rect x="0" y="0" width="10" height="30" fill="#E85D2C" rx="2" filter="url(#feltTexture3)"/>
        <rect x="20" y="0" width="10" height="30" fill="#E85D2C" rx="2" filter="url(#feltTexture3)"/>
        <rect x="0" y="10" width="30" height="10" fill="#E85D2C" rx="2" filter="url(#feltTexture3)"/>
        
        <path d="M 40 5 A 15 15 0 1 1 40 25 L 32 25 A 7 7 0 1 0 32 5 Z" 
              fill="#E85D2C" filter="url(#feltTexture3)"/>
        
        <!-- HC 内部光泽 -->
        <rect x="1" y="1" width="8" height="28" fill="url(#innerGlow3)" rx="1" opacity="0.6"/>
        <rect x="21" y="1" width="8" height="28" fill="url(#innerGlow3)" rx="1" opacity="0.6"/>
        <rect x="1" y="11" width="28" height="8" fill="url(#innerGlow3)" rx="1" opacity="0.6"/>
        
        <path d="M 38 6 A 14 14 0 1 1 38 24 L 33 24 A 6 6 0 1 0 33 6 Z" 
              fill="url(#innerGlow3)" opacity="0.6"/>
      </g>
      
      <ellipse cx="165" cy="110" rx="40" ry="12" fill="white" opacity="0.08"/>
    </g>
  </g>
  
  <!-- 变体3: 浅色毛毡 -->
  <g transform="translate(640, 128)">
    <text x="128" y="-20" font-family="Arial, sans-serif" font-size="14" fill="#333" text-anchor="middle">浅色毛毡质感</text>
    
    <g transform="rotate(85, 128, 128)">
      <ellipse cx="128" cy="128" rx="100" ry="40" 
               fill="#FFB380" 
               filter="url(#feltEdge3)"/>
      
      <ellipse cx="128" cy="128" rx="98" ry="38" 
               fill="#FF8A5B" 
               filter="url(#feltTexture3)"
               opacity="0.8"/>
      
      <ellipse cx="128" cy="118" rx="90" ry="30" 
               fill="url(#innerGlow3)"/>
      
      <ellipse cx="128" cy="128" rx="80" ry="30" 
               fill="none" 
               stroke="#E85D2C" 
               stroke-width="1"
               opacity="0.3"/>
      
      <!-- HC 字母浅色毛毡 -->
      <g transform="translate(140, 115)" filter="url(#hcFeltShadow3)">
        <rect x="0" y="0" width="10" height="30" fill="#FF8A5B" rx="2" filter="url(#feltTexture3)"/>
        <rect x="20" y="0" width="10" height="30" fill="#FF8A5B" rx="2" filter="url(#feltTexture3)"/>
        <rect x="0" y="10" width="30" height="10" fill="#FF8A5B" rx="2" filter="url(#feltTexture3)"/>
        
        <path d="M 40 5 A 15 15 0 1 1 40 25 L 32 25 A 7 7 0 1 0 32 5 Z" 
              fill="#FF8A5B" filter="url(#feltTexture3)"/>
        
        <!-- HC 内部光泽 -->
        <rect x="1" y="1" width="8" height="28" fill="url(#innerGlow3)" rx="1" opacity="0.6"/>
        <rect x="21" y="1" width="8" height="28" fill="url(#innerGlow3)" rx="1" opacity="0.6"/>
        <rect x="1" y="11" width="28" height="8" fill="url(#innerGlow3)" rx="1" opacity="0.6"/>
        
        <path d="M 38 6 A 14 14 0 1 1 38 24 L 33 24 A 6 6 0 1 0 33 6 Z" 
              fill="url(#innerGlow3)" opacity="0.6"/>
      </g>
      
      <ellipse cx="165" cy="110" rx="40" ry="12" fill="white" opacity="0.12"/>
    </g>
  </g>
  
  <!-- 变体4: 无纹理毛毡 -->
  <g transform="translate(896, 128)">
    <text x="128" y="-20" font-family="Arial, sans-serif" font-size="14" fill="#333" text-anchor="middle">无纹理毛毡质感</text>
    
    <g transform="rotate(85, 128, 128)">
      <ellipse cx="128" cy="128" rx="100" ry="40" 
               fill="url(#harmonyFeltGradient3)" 
               filter="url(#feltEdge3)"/>
      
      <ellipse cx="128" cy="118" rx="90" ry="30" 
               fill="url(#innerGlow3)"/>
      
      <ellipse cx="128" cy="128" rx="80" ry="30" 
               fill="none" 
               stroke="#CC4A1F" 
               stroke-width="1"
               opacity="0.3"/>
      
      <!-- HC 字母无纹理毛毡 -->
      <g transform="translate(140, 115)" filter="url(#hcFeltShadow3)">
        <rect x="0" y="0" width="10" height="30" fill="url(#hcFeltGradient3)" rx="2"/>
        <rect x="20" y="0" width="10" height="30" fill="url(#hcFeltGradient3)" rx="2"/>
        <rect x="0" y="10" width="30" height="10" fill="url(#hcFeltGradient3)" rx="2"/>
        
        <path d="M 40 5 A 15 15 0 1 1 40 25 L 32 25 A 7 7 0 1 0 32 5 Z" 
              fill="url(#hcFeltGradient3)"/>
        
        <!-- HC 内部光泽 -->
        <rect x="1" y="1" width="8" height="28" fill="url(#innerGlow3)" rx="1" opacity="0.6"/>
        <rect x="21" y="1" width="8" height="28" fill="url(#innerGlow3)" rx="1" opacity="0.6"/>
        <rect x="1" y="11" width="28" height="8" fill="url(#innerGlow3)" rx="1" opacity="0.6"/>
        
        <path d="M 38 6 A 14 14 0 1 1 38 24 L 33 24 A 6 6 0 1 0 33 6 Z" 
              fill="url(#innerGlow3)" opacity="0.6"/>
      </g>
      
      <ellipse cx="165" cy="110" rx="40" ry="12" fill="white" opacity="0.1"/>
    </g>
  </g>
</svg>
