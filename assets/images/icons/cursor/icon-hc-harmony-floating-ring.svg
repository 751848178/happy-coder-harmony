      stroke-width="94"
      stroke-linecap="round"/>
    <path
      d="M 220 590 A 300 126 0 0 0 820 590"
      stroke="url(#ringMain)"
      stroke-width="80"
      stroke-linecap="round"/>
    <path
      d="M 220 590 A 300 126 0 0 0 820 590"
      stroke="url(#ringHighlight)"
      stroke-width="32"
      stroke-linecap="round"
      opacity="0.92"/>
  </g>

  <g filter="url(#letterFloat)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#520D27" stroke-opacity="0.24" stroke-width="112">
      <path d="M 334 370 V 668"/>
      <path d="M 498 370 V 668"/>
      <path d="M 334 520 H 498"/>
      <path d="M 808 438 C 748 394 688 400 662 446 C 628 496 628 560 664 612 C 696 658 756 664 808 624"/>
    </g>

    <g stroke="url(#letterMain)" stroke-width="96">
      <path d="M 334 370 V 668"/>
      <path d="M 498 370 V 668"/>
      <path d="M 334 520 H 498"/>
      <path d="M 808 438 C 748 394 688 400 662 446 C 628 496 628 560 664 612 C 696 658 756 664 808 624"/>
    </g>

    <g stroke="url(#letterHighlight)" stroke-width="28" opacity="0.96">
      <path d="M 334 370 V 668"/>
      <path d="M 498 370 V 668"/>
      <path d="M 334 520 H 498"/>
      <path d="M 808 438 C 748 394 688 400 662 446 C 628 496 628 560 664 612 C 696 658 756 664 808 624"/>
    </g>
  </g>

  <g transform="rotate(-17 520 590)" filter="url(#frontArcDepth)">
    <path
      d="M 220 590 A 300 126 0 0 1 820 590"
      stroke="#5A0C29"
      stroke-opacity="0.32"
      stroke-width="92"
      stroke-linecap="round"/>
    <path
      d="M 220 590 A 300 126 0 0 1 820 590"
      stroke="url(#ringMain)"
      stroke-width="76"
      stroke-linecap="round"/>
    <path
      d="M 220 590 A 300 126 0 0 1 820 590"
      stroke="url(#ringHighlight)"
      stroke-width="28"
      stroke-linecap="round"
      opacity="0.88"/>
