    <linearGradient id="letterHighlight" x1="364" y1="356" x2="718" y2="570" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.52" stop-color="#FFEBD3" stop-opacity="0.94"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.18"/>
