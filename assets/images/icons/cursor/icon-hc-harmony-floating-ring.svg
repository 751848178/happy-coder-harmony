    <filter id="ringGlow" x="90" y="240" width="860" height="540" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="26" stdDeviation="28" flood-color="#210713" flood-opacity="0.34"/>
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#FF9B67" flood-opacity="0.18"/>
    </filter>

    <filter id="letterFloat" x="190" y="250" width="690" height="520" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="30" stdDeviation="24" flood-color="#160712" flood-opacity="0.46"/>
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#FFD7BE" flood-opacity="0.12"/>
    </filter>

    <filter id="frontArcDepth" x="110" y="360" width="820" height="420" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#220814" flood-opacity="0.28"/>
    </filter>
