<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgBase" x1="132" y1="118" x2="896" y2="910" gradientUnits="userSpaceOnUse">
      <stop stop-color="#19245A"/>
      <stop offset="0.5" stop-color="#2442A1"/>
      <stop offset="1" stop-color="#0E1231"/>
    </linearGradient>

    <radialGradient id="bgCoolGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(324 286) rotate(46) scale(330 274)">
      <stop stop-color="#91A3FF" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#91A3FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bgWarmGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(784 794) rotate(24) scale(286 240)">
      <stop stop-color="#FF8E64" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#FF8E64" stop-opacity="0"/>
