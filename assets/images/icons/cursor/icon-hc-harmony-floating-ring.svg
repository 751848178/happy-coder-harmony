    <radialGradient id="floorGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(520 760) scale(278 80)">
      <stop stop-color="#FF6B4D" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FF6B4D" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="ringMain" x1="228" y1="404" x2="828" y2="700" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF0DE"/>
      <stop offset="0.14" stop-color="#FFB16B"/>
      <stop offset="0.42" stop-color="#FF744C"/>
      <stop offset="0.74" stop-color="#EC3E61"/>
      <stop offset="1" stop-color="#B11D58"/>
