  <rect x="72" y="72" width="880" height="880" rx="228" fill="url(#bgBase)"/>
  <circle cx="324" cy="286" r="240" fill="url(#bgCoolGlow)"/>
  <circle cx="784" cy="794" r="228" fill="url(#bgWarmGlow)"/>

  <ellipse cx="520" cy="760" rx="278" ry="80" fill="url(#floorGlow)" filter="url(#softBlur)"/>
  <ellipse cx="520" cy="544" rx="192" ry="112" fill="#FF8A5B" fill-opacity="0.14" filter="url(#softBlur)"/>

