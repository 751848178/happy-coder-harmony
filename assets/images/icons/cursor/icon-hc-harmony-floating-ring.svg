    <linearGradient id="letterMain" x1="314" y1="334" x2="812" y2="722" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF8EE"/>
      <stop offset="0.16" stop-color="#FFD7A2"/>
      <stop offset="0.4" stop-color="#FF9E56"/>
      <stop offset="0.7" stop-color="#F4514E"/>
      <stop offset="1" stop-color="#AD1C56"/>
