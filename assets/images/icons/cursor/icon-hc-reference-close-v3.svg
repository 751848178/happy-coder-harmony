      <stop offset="0.5" stop-color="#CDD1D2"/>
      <stop offset="1" stop-color="#AEB4B7"/>
    </linearGradient>

    <linearGradient id="metalTubeFront" x1="248" y1="598" x2="780" y2="722" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D9DDDE"/>
      <stop offset="0.45" stop-color="#C5CACB"/>
      <stop offset="1" stop-color="#A4ABAE"/>
    </linearGradient>

    <linearGradient id="tubeHighlight" x1="330" y1="324" x2="716" y2="590" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.86"/>
      <stop offset="0.34" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
