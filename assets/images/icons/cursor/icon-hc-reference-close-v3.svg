<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgWarmGrey" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(520 350) rotate(90) scale(760 900)">
      <stop stop-color="#F5F2EE"/>
      <stop offset="0.7" stop-color="#EAE5DF"/>
      <stop offset="1" stop-color="#E3DED7"/>
