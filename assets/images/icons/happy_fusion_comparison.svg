<svg width="1800" height="980" viewBox="0 0 1800 980" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1800" height="980" fill="#0B1020"/>
  <text x="108" y="110" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700">Fusion Concepts</text>
  <text x="108" y="156" fill="#97A2C8" font-family="Arial, Helvetica, sans-serif" font-size="22">F1 = S3 + R3 / F2 = S3 + S1，并保留 R6 作为稳妥基线</text>

  <rect x="84" y="214" width="500" height="650" rx="36" fill="#131A2D" stroke="#212B48"/>
  <rect x="650" y="214" width="500" height="650" rx="36" fill="#131A2D" stroke="#212B48"/>
  <rect x="1216" y="214" width="500" height="650" rx="36" fill="#131A2D" stroke="#212B48"/>

  <image href="happy_fusion_f1_s3_r3.svg" x="134" y="264" width="400" height="400"/>
  <image href="happy_fusion_f2_s3_s1.svg" x="700" y="264" width="400" height="400"/>
  <image href="happy_refined_r6_window_cut.svg" x="1266" y="264" width="400" height="400"/>

  <text x="146" y="726" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">F1 / S3 + R3</text>
  <text x="146" y="768" fill="#97A2C8" font-family="Arial, Helvetica, sans-serif" font-size="22">品牌感和终端语义最平衡</text>

  <text x="712" y="726" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">F2 / S3 + S1</text>
  <text x="712" y="768" fill="#97A2C8" font-family="Arial, Helvetica, sans-serif" font-size="22">更符号化，也更偏工具</text>

  <text x="1278" y="726" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">R6 / Baseline</text>
  <text x="1278" y="768" fill="#97A2C8" font-family="Arial, Helvetica, sans-serif" font-size="22">最稳妥、最克制的现成方案</text>
</svg>
