# Server-side deployment compose file.
# Use this on your China server after loading the pre-built image.
# No build step — the image was exported from build.sh and loaded via docker load.
#
# Quick start:
#   cp .env.example .env && vim .env   # set HAPPY_PUBLIC_URL, HANDY_MASTER_SECRET
#   docker compose -f docker-compose.server.yml up -d

services:
  happy-server:
    image: happy-server-custom:local
    restart: unless-stopped
    ports:
      - "${HAPPY_SERVER_PORT:-3005}:3005"
    environment:
      PORT: "3005"
      PUBLIC_URL: ${HAPPY_PUBLIC_URL:?Set HAPPY_PUBLIC_URL in .env}
      HANDY_MASTER_SECRET: ${HANDY_MASTER_SECRET:?Set HANDY_MASTER_SECRET in .env}
      # Leave DATABASE_URL empty to use embedded PGlite (zero external deps).
      # Set it to a PostgreSQL URL to use an external database.
      DATABASE_URL: ${DATABASE_URL:-}
      DATA_DIR: ${DATA_DIR:-/data}
      PGLITE_DIR: ${PGLITE_DIR:-}
      REDIS_URL: ${REDIS_URL:-}
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      METRICS_PORT: ${METRICS_PORT:-9090}
      S3_HOST: ${S3_HOST:-}
      S3_PORT: ${S3_PORT:-}
      S3_USE_SSL: ${S3_USE_SSL:-true}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_PRIVATE_KEY: ${GITHUB_PRIVATE_KEY:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-}
      GITHUB_REDIRECT_URL: ${GITHUB_REDIRECT_URL:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - happy_server_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3005/health').then((res) => process.exit(res.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  happy_server_data:
